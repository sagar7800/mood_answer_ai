<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | MoodAnswer AI</title>
    <link rel="stylesheet" href="css/global.css" />
  </head>

  <body>
    <main class="login-shell">
      <section class="brand-side">
        <div class="brand-card">
          <div class="auth-logo">✦</div>

          <h2>Welcome back</h2>

          <p>
            Continue your mood-aware learning journey. Ask questions and get
            answers that match how you feel.
          </p>

          <div class="mood-list">
            <span>😊 Calm</span>
            <span>🤔 Simple</span>
            <span>🔥 Detailed</span>
            <span>😴 Short</span>
          </div>
        </div>
      </section>

      <section class="login-panel" aria-label="Login form">
        <p class="eyebrow">Secure access</p>

        <h1>MoodAnswer Login</h1>

        <p class="login-copy">
          Sign in to use the mood-aware Gemini assistant.
        </p>

        <form id="loginForm" class="login-form">
          <div class="input-group">
            <label class="field-label" for="username">Email or username</label>
            <input
              id="username"
              name="username"
              type="text"
              autocomplete="username"
              placeholder="you@example.com"
              required
            />
          </div>

          <div class="input-group">
            <label class="field-label" for="password">Password</label>
            <input
              id="password"
              name="password"
              type="password"
              autocomplete="current-password"
              placeholder="Password"
              required
            />
          </div>

          <div class="form-options">
            <label class="remember-me">
              <input type="checkbox" />
              <span>Remember me</span>
            </label>

            <a href="#" class="forgot-link">Forgot password?</a>
          </div>

          <button type="submit">Login</button>

          <p id="loginMessage" class="form-message" aria-live="polite"></p>
        </form>

        <p class="auth-switch">
          New here? <a href="/signup">Create an account</a>
        </p>
      </section>
    </main>

    <script src="js/api.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/auth.js"></script>
  </body>
</html>
